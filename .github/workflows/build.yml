name: Build CzoS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm qemu-system-x86

      - name: Build OS
        run: make all

      - name: Save artifacts
        uses: actions/upload-artifact@v3
        with:
          name: czos-binaries
          path: czos.bin
